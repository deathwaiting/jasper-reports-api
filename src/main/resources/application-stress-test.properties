# Stress test profile
# Used only by the "stress-test" Maven profile to isolate the application performance
# with a real PostgreSQL instance (started via Testcontainers), a large generated
# dataset and an optional artificial DB latency.

# Seed the employee table (portfolio data.sql) and let LargeDatasetGenerator grow it
# to the stress dataset size.
spring.sql.init.mode=always

# Serve the same report fixtures used by the integration tests
dev.galal.jasper-rest-server.reports-dir=src/test/resources/test-reports

# Realistic security: same credentials as the default test profile
spring.security.user.name=user
spring.security.user.password=pass

# Pool sized for concurrent queries: each report fill holds one connection for the
# duration of the query. The PostgreSQL container starts with max_connections raised
# above this so the pool never exhausts it.
# Applied on the stress DataSource bean (not spring.datasource.hikari.*, which the bean ignores).
dev.galal.jasper-rest-server.stress.db-pool-size=${stress.db.pool.size:300}
dev.galal.jasper-rest-server.stress.db-pool-min-idle=${stress.db.pool.min-idle:30}

# Optional extra per-connection latency (ms) added on top of the real DB round-trip.
# Defaults to 0: the real PostgreSQL instance already provides realistic latency.
dev.galal.jasper-rest-server.stress.db-latency-ms=${stress.db.latency.ms:0}

# Minimum number of employee rows the stress dataset must contain
dev.galal.jasper-rest-server.stress.dataset-size=${stress.dataset.size:3000}